# Ingesta FRED programada (ADR 0004): GitHub Actions + Cloudflare R2.
#
# Cada corrida trae el estado desde R2, corre la descarga inicial (o su continuación) o la
# actualización semanal, y deja todo de vuelta en R2. Secrets del repositorio:
# FRED_API_KEY, CLOUDFLARE_ACCOUNT_ID, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Variable opcional: R2_BUCKET (si el bucket no se llama como storage.bucket en config.yaml).
name: Ingesta

on:
  schedule:
    - cron: "13 6 * * 0" # domingos 06:13 UTC
  workflow_dispatch: {}

# Nunca dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingesta:
    runs-on: ubuntu-latest
    # Límite de GitHub: 6 h por job. Lo cortado se reanuda en la próxima corrida.
    timeout-minutes: 355
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      # Fase 4 (ADR 0007). download.bls.gov exige un User-Agent con contacto: SEC_USER_AGENT.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Instalar rclone
        run: sudo infra/install_rclone.sh
      - name: Verificar secrets
        run: |
          for v in FRED_API_KEY CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::falta el secret $v"; exit 1; }
          done
          # Sin estos, solo falla su fuente (sources_update.sh sigue con las demás).
          for v in SEC_USER_AGENT BEA_API_KEY CENSUS_API_KEY; do
            [ -n "${!v}" ] || echo "::warning::falta el secret $v"
          done
      - name: Traer estado desde R2
        run: infra/pull_r2.sh
      - name: Ingesta
        run: infra/run_actions.sh
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Ingesta FRED"
            echo '```'
            tail -n 3 data/logs/runs.jsonl 2>/dev/null || echo "sin registros"
            echo '```'
            echo "### Conteos (copia local, ya sincronizada con R2)"
            echo '```json'
            timeout 600 uv run python -m src.catalog summary 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de la corrida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 30
          if-no-files-found: ignore
