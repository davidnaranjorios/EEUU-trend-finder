# Ingesta FRED programada (ADR 0004): GitHub Actions + Cloudflare R2.
#
# Cada corrida trae el estado desde R2, corre la descarga inicial (o su continuación) o la
# actualización semanal, y deja todo de vuelta en R2. Secrets del repositorio:
# FRED_API_KEY, CLOUDFLARE_ACCOUNT_ID, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Variable opcional: R2_BUCKET (si el bucket no se llama como storage.bucket en config.yaml).
#
# Primer eslabón de la semana (docs/infra/github-actions.md): FRED -> fuentes de agencias ->
# fuentes de mercado -> texto -> detectores -> reporte. Cada eslabón lanza el siguiente solo si
# terminó bien; cada uno tiene su propio presupuesto (< 5 h 30) y su propia sincronización a R2.
name: Ingesta

on:
  schedule:
    - cron: "13 6 * * 0" # domingos 06:13 UTC
  workflow_dispatch:
    inputs:
      encadenar:
        description: "Al terminar bien, lanzar el resto de la cadena semanal"
        type: boolean
        default: false

# Nunca dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para lanzar el eslabón siguiente de la cadena semanal

jobs:
  ingesta:
    runs-on: ubuntu-latest
    # Presupuesto < 5 h 30 (límite de GitHub: 6 h). Lo cortado se reanuda en la próxima corrida.
    timeout-minutes: 330
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Instalar rclone
        run: sudo infra/install_rclone.sh
      - name: Verificar secrets
        run: |
          for v in FRED_API_KEY CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::falta el secret $v"; exit 1; }
          done
      - name: Traer estado desde R2
        run: infra/pull_r2.sh
      - name: Ingesta
        run: infra/run_actions.sh
      - name: Encadenar ingesta-fuentes.yml
        # Freno: solo si todos los pasos anteriores salieron bien (success()).
        if: ${{ success() && (github.event_name == 'schedule' || inputs.encadenar) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingesta-fuentes.yml --ref "${GITHUB_REF_NAME}" -f encadenar=true
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Ingesta FRED"
            echo '```'
            tail -n 3 data/logs/runs.jsonl 2>/dev/null || echo "sin registros"
            echo '```'
            echo "### Conteos (copia local, ya sincronizada con R2)"
            echo '```json'
            timeout 600 uv run python -m src.catalog summary 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de la corrida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 30
          if-no-files-found: ignore
