# Verificación de solo lectura de lo que hay en R2 (ADR 0004): tamaño por carpeta y conteos
# por tabla con DuckDB. No escribe nada. Se lanza a mano.
name: Verificar R2

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Instalar rclone
        run: sudo infra/install_rclone.sh
      - name: Tamaño por carpeta
        run: |
          source infra/r2_env.sh
          {
            echo "## R2: $BUCKET"
            echo '```'
            for dir in processed signals exports logs _trash; do
              echo "$dir: $(rclone size "r2:$BUCKET/$dir" --fast-list --json)"
            done
            rclone cat "r2:$BUCKET/exports/funnel.json" | head -c 4000
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Lectura directa desde R2 con DuckDB/httpfs, cronometrada. Con los 14.491 archivos sin
      # compactar no terminó en 30 min; compactados (un archivo por bucket) debe tardar minutos.
      - name: Conteos leyendo directo de R2 (httpfs)
        timeout-minutes: 15
        continue-on-error: true
        run: |
          start=$(date +%s)
          rc=0
          out="$(uv run python -m src.catalog summary --r2 2>&1)" || rc=$?
          secs=$(( $(date +%s) - start ))
          {
            echo "### Lectura directa desde R2: ${secs} s (rc=$rc)"
            echo '```json'
            echo "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # Además se baja processed/ con rclone y se cuenta en local: prueba el mismo camino que
      # usa la ingesta y sirve de respaldo si la lectura por httpfs falla.
      - name: Traer processed desde R2
        run: infra/pull_r2.sh
      - name: Conteos con DuckDB
        timeout-minutes: 10
        run: |
          {
            echo '```json'
            uv run python -m src.catalog summary
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
