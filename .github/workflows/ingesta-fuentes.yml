# Ingesta de las fuentes de agencias (BLS, BEA, Census, EIA; ADR 0007, 0019 y 0027).
#
# Segundo eslabón de la cadena semanal. Trae de R2 solo el estado de estas tres fuentes, corre
# `infra/sources_update.sh bls bea census eia` con presupuesto por fuente y total < 5 h 30 y sincroniza
# solo sus rutas. Lo que no cabe queda pendiente para la próxima corrida. Mismo grupo de
# concurrencia que FRED: nunca dos sync a R2 a la vez.
name: Ingesta fuentes

on:
  workflow_dispatch:
    inputs:
      encadenar:
        description: "Al terminar bien, lanzar el resto de la cadena semanal"
        type: boolean
        default: false

# Nunca dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para lanzar el eslabón siguiente de la cadena semanal

jobs:
  fuentes:
    runs-on: ubuntu-latest
    # Presupuesto < 5 h 30 (límite de GitHub: 6 h). Lo cortado se reanuda en la próxima corrida.
    timeout-minutes: 330
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      # download.bls.gov exige un User-Agent con contacto: SEC_USER_AGENT.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      SOURCES_TOTAL_MIN: "300" # < 5 h 30 con la preparación del job
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Instalar rclone
        run: sudo infra/install_rclone.sh
      - name: Verificar secrets
        run: |
          for v in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::falta el secret $v"; exit 1; }
          done
      - name: Traer estado desde R2
        run: >-
          infra/pull_r2.sh processed/series/bls processed/series/bea processed/series/census processed/series/eia processed/series_meta/bls processed/series_meta/bea processed/series_meta/census processed/series_meta/eia processed/lineage/eligibility/bls processed/lineage/eligibility/bea processed/lineage/eligibility/census processed/lineage/eligibility/eia processed/_internal/source_catalog/bls processed/_internal/source_catalog/bea processed/_internal/source_catalog/census processed/_internal/source_catalog/eia processed/_internal/source_unit_state/bls processed/_internal/source_unit_state/bea processed/_internal/source_unit_state/census processed/_internal/source_unit_state/eia processed/ingest_state logs
      - name: Ingesta
        run: infra/sources_update.sh bls bea census eia
      - name: Encadenar ingesta-mercado.yml
        # Freno: solo si todos los pasos anteriores salieron bien (success()).
        if: ${{ success() && inputs.encadenar }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingesta-mercado.yml --ref "${GITHUB_REF_NAME}" -f encadenar=true
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Ingesta de fuentes de agencias"
            echo '```'
            tail -n 3 data/logs/runs.jsonl 2>/dev/null || echo "sin registros"
            echo '```'
            echo "### Conteos (copia local, ya sincronizada con R2)"
            echo '```json'
            timeout 600 uv run python -m src.catalog summary 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de la corrida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-fuentes-${{ github.run_id }}
          path: data/logs/
          retention-days: 30
          if-no-files-found: ignore
