# Ingesta de texto (Fase 3, ADR 0005): Federal Register (govinfo) y EDGAR (10-K).
#
# Cada corrida trae desde R2 solo las tablas de texto y su estado, sigue la descarga por tramos
# (un periodo o varios por tramo) y sincroniza de vuelta solo esas rutas. Comparte el grupo de
# concurrencia con la ingesta de FRED para que dos sync a R2 nunca corran a la vez.
# Secrets: SEC_USER_AGENT ("Nombre Apellido correo", lo exige la SEC), CLOUDFLARE_ACCOUNT_ID,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY. Variable opcional: R2_BUCKET.
name: Ingesta texto

on:
  schedule:
    - cron: "47 10 * * 0" # domingos 10:47 UTC, después de la ingesta FRED
  workflow_dispatch:
    inputs:
      sources:
        description: "Fuentes, separadas por espacio"
        default: "federal_register edgar"
        required: false

concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  texto:
    runs-on: ubuntu-latest
    # Límite de GitHub: 6 h por job. Lo cortado se reanuda en la próxima corrida.
    timeout-minutes: 355
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      TEXT_SOURCES: ${{ inputs.sources || 'federal_register edgar' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Instalar rclone
        run: sudo infra/install_rclone.sh
      - name: Verificar secrets
        run: |
          for v in SEC_USER_AGENT CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::falta el secret $v"; exit 1; }
          done
      - name: Traer estado de texto desde R2
        run: >-
          infra/pull_r2.sh processed/text_docs processed/term_freq
          processed/lineage/text_ingest processed/ingest_state/text logs
      - name: Ingesta de texto
        run: infra/run_texto.sh
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Ingesta de texto"
            echo '```'
            tail -n 3 data/logs/runs.jsonl 2>/dev/null || echo "sin registros"
            echo '```'
            echo "### Conteos (copia local, ya sincronizada con R2)"
            echo '```json'
            timeout 600 uv run python -m src.ingest.text summary 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-texto-${{ github.run_id }}
          path: data/logs/
          retention-days: 30
          if-no-files-found: ignore
