# Tabla data_origin (ADR 0010, aprobada por David el 2026-11-04): ORIGEN primario del dato cuando
# una agencia lo republica o lo deriva de otra. La independencia (principio 4) se cuenta por
# origen, no por la agencia que publica. Es metodología de independencia, no una lista de temas:
# el archivo solo lo lee src/rank/origin.py, que valida el esquema (versionado en git).
# Cada regla: `match` (AND de source / release_id / agency / series_id_regex / units_regex),
# `origin` (clave de origen; el mismo texto que la agencia raíz si es una agencia) y `chain`
# (cadena legible, de la raíz a quien republica). Gana la primera regla que casa.
# Una serie sin regla conserva su agencia como origen.
version: 1
rules:
  - id: fdic_qbp_call_reports
    match: {source: fred, release_id: 482}          # FDIC Quarterly Banking Profile
    origin: call_reports
    chain: [Call Reports (FFIEC), FDIC QBP]
  - id: z1_banks_call_reports
    # Z.1, sectores de bancos (códigos 70 depository institutions, 73, 74, 76 en el id): se arman
    # con los Call Reports.
    match: {source: fred, release_id: 52, series_id_regex: "^BOGZ1[A-Z]{2}(70|73|74|76)"}
    origin: call_reports
    chain: [Call Reports (FFIEC), Fed Z.1]
  - id: z1_all_sectors_aggregate
    # Z.1, sector 89 "All Sectors": agregado de todos los sectores. Se arma con los de sus
    # componentes, el de bancos incluido (Call Reports), así que NO es independiente de ellos:
    # `inherits_from` le suma los orígenes de esas reglas a los de la Fed. Otros sectores
    # agregados (por confirmar con los títulos de la corrida real) se agregarían aquí.
    match: {source: fred, release_id: 52, series_id_regex: "^BOGZ1[A-Z]{2}89"}
    origin: Board of Governors of the Federal Reserve System
    inherits_from: [z1_banks_call_reports]
    chain: [Call Reports (FFIEC), Fed Z.1 (agregado de todos los sectores)]
  - id: z1_price_indices_bea
    # Z.1, sector 07 "Interest Rates and Price Indexes", instrumento 075 (índices de precios) en
    # cadena (Chain Weights): vienen de BEA. Las tasas (072, 073) no.
    match:
      source: fred
      release_id: 52
      series_id_regex: "^BOGZ1[A-Z]{2}075"
      title_regex: "(?i)chain weights|price deflator"
    origin: bureau of economic analysis
    chain: [BEA, Fed Z.1]
  - id: h8_call_reports
    # H.8 (Assets and Liabilities of Commercial Banks): muestra semanal con benchmark a los
    # Call Reports. No es independiente de ellos (ADR 0010, revisión 702b8ff3).
    match: {source: fred, release_id: 22}
    origin: call_reports
    chain: [Call Reports (FFIEC), Fed H.8 (benchmark)]
  - id: oecd_mei_wages_bls
    # OECD MEI (release 205), series de remuneración (prefijo LC) y empleo/paro (LR, LF):
    # los valores de EE. UU. vienen de BLS.
    match: {source: fred, release_id: 205, series_id_regex: "^L[CRF]"}
    origin: bureau of labor statistics
    chain: [BLS, OCDE MEI]
  - id: bea_price_indexes_bls
    # Índices de precios y deflactores de BEA (NIPA, NIUnderlyingDetail, GDPbyIndustry y
    # UnderlyingGDPbyIndustry): BEA los arma sobre todo con índices de BLS (PPI, IPC y precios de
    # importación). Se identifican por la descripción oficial de la tabla ("Price Indexes",
    # "Implicit Price Deflators", "in Prices"), no por tema. Las tablas de cantidad (Chain-Type
    # Quantity Indexes, Chained Dollars) y de valor nominal NO casan: siguen con su agencia.
    # Fuentes (ADR 0013, sección 10): NIPA Handbook, cap. 4, p. 4-25 (dic. 2023) y Survey of Current
    # Business, marzo de 1998, "Gross Product by Industry Price Measures".
    match:
      source: bea
      series_id_regex: "^(?:NIPA|NIUnderlyingDetail|GDPbyIndustry|UnderlyingGDPbyIndustry):"
      title_regex: "(?i)price indexes?|price deflators?|\\bin prices\\b"
    origin: U.S. Bureau of Economic Analysis
    also_origin: [U.S. Bureau of Labor Statistics]
    chain: ["BLS (PPI, IPC, precios de importación)", "BEA (índice de precios o deflactor)"]
  - id: bea_price_indexes_bls_via_fred
    # Los mismos índices de precios de BEA cuando llegan vía FRED (agencia BEA); se reconocen por el
    # título de FRED: "Implicit Price Deflator", "Chain-type Price Index", "Price Indexes".
    match:
      source: fred
      agency: U.S. Bureau of Economic Analysis
      title_regex: "(?i)price index|price indexes|price deflator|implicit price|chain-type price"
    origin: U.S. Bureau of Economic Analysis
    also_origin: [U.S. Bureau of Labor Statistics]
    chain: ["BLS (PPI, IPC, precios de importación)", "BEA (índice de precios o deflactor)"]
  - id: cleveland_fed_cpi_measures_bls
    # Mediana y media recortada del IPC del Fed de Cleveland (MEDCPIM158SFRBCLE, MEDCPIM094SFRBCLE,
    # TRMMEANCPIM159SFRBCLE y equivalentes): se calculan con los componentes del IPC de BLS, así
    # que NO son una fuente independiente del IPC (ADR 0025). Se identifican por el prefijo del id
    # y el sufijo del Fed de Cleveland, no por tema. Fuente: Cleveland Fed, "Median CPI" y
    # "Trimmed-Mean CPI" (metodología: componentes del CPI de BLS reponderados).
    match: {source: fred, series_id_regex: "^(?:MEDCPI|TRMMEANCPI)\\w*SFRBCLE$"}
    origin: bureau of labor statistics
    chain: [BLS (IPC), Fed de Cleveland (mediana / media recortada)]
