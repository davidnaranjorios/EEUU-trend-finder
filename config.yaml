# Configuración del sistema. Prohibido listar temas, industrias, términos o series aquí
# (principio 1; lo verifica tests/test_no_hardcoded_topics.py).

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  signals_dir: data/signals
  logs_dir: data/logs
  reports_dir: reports

eligibility:
  # Mínimo de observaciones por frecuencia para que una serie entre a los detectores.
  min_obs:
    D: 1000
    W: 260
    M: 120
    Q: 40
    A: 15
  # Una serie sin actualizar en más de estos días se considera inactiva.
  max_staleness_days:
    D: 30
    W: 60
    M: 120
    Q: 240
    A: 730
  # Umbrales fijados el 2026-10-23 a la vista del embudo medido (ADR 0002).
  # Historia más corta que esto no se descarta: va al grupo "nuevas".
  min_history_years: 10
  # Series jóvenes (ADR 0017): los grupos del embudo con historia corta que pasan SOLO al detector
  # `relative_growth` (nunca a slope ni a regime). Se descargan si su nivel geográfico está en
  # `download.groups`; se usan si su historia está entre min_years y max_years.
  young:
    groups: [nuevas]
    min_years: 3
    max_years: 15
  # Una versión por variable (mismo título normalizado). Orden de preferencia del representante:
  # ajuste estacional, unidades en nivel sobre transformadas, frecuencia más alta que cumpla la
  # historia mínima, historia más larga y, en empate, el identificador.
  variants:
    seasonal_preference: [SA, SAAR, SSA, NSA, NSAAR]
    transformed_units_regex: "(?i)change|growth"
    frequency_preference: [D, W, M, Q, A]

# Vintages de ALFRED solo para una muestra aleatoria estratificada (frecuencia x agencia).
vintages:
  sample_size: 2000
  seed: 20261021
  groups: [nacional]
  max_vintage_dates_per_request: 2000   # tope oficial de series/observations

# Descarga inicial y semanal de valores vigentes (API v2 por release). Decidido: solo nacional.
download:
  groups: [nacional]
  v2_page_limit: 500000                 # máximo oficial de release/observations

# Exportes para la futura web estática (src/export.py). Fichas solo de estos grupos; los demás se
# cuentan en funnel.json. Si un archivo o el total pasa el tope, el export falla (no publica).
exports:
  groups: [nacional]
  n_buckets: 64
  max_file_kb: 512
  max_total_mb: 20

# Parquet definitivo en Cloudflare R2. Credenciales solo en .env (AWS_*, CLOUDFLARE_ACCOUNT_ID).
storage:
  bucket: trend-finder
  prefix: processed

persistence:
  # Periodos consecutivos que debe sostenerse una aceleración para contar.
  min_consecutive_periods:
    D: 60
    W: 13
    M: 6
    Q: 3
    A: 2

# Detectores numéricos de la Fase 2 (ADR 0007). Solo parámetros: ningún tema ni serie.
detect:
  # Fuentes numéricas de la familia: una familia FDR por detector y corrida, todas juntas (ADR 0009).
  sources: [fred, bls, bea, census]
  detectors: [slope, regime]
  # Ventana del cambio de pendiente, en periodos de la grilla (D y W se agregan a mensual):
  # 5 años recientes frente a 5 previos; anual 7 + 7 (decisión del 2026-11-03).
  slope_window: {M: 60, Q: 20, A: 7}
  lookback_years: 15            # historia usada por ambos detectores (CUSUM y línea base)
  # Línea base mínima del nulo de slope, en periodos. Medido (ADR 0007): anuales con 8 o 23
  # periodos de base daban P(p<0,001) de 2,2 % y 0,6 % con AR(1); con 33, 0,1 %.
  slope_min_baseline: 33
  winsor_mad: 4.0               # crecimiento recortado en mediana ± 4·MAD
  max_gap_share: 0.1            # máximo de periodos faltantes dentro de la ventana
  phi_margin: 1.0               # φ del post-blackening + 1 error estándar (conservador)
  # regime: las pruebas en el piso (< 10 excedencias de 999) se recalculan con estas réplicas
  # (el CUSUM es barato); después, cola GPD sobre ese nulo si aún hace falta.
  regime_escalate: 99999
  workers: 4                    # procesos (runner de GitHub Actions: 4 vCPU)
  tail:                         # cola GPD (Knijnenburg et al. 2009)
    method: gpd
    min_exceedances: 10
    n_exceed: 250
    n_exceed_min: 50
    gof_alpha: 0.05
  # Detector `relative_growth` (series jóvenes, ADR 0017): crecimiento relativo a su agregado
  # padre. Familia FDR propia; confianza por defecto amarilla (🟡). No toca la calibración de
  # slope ni de regime. phi_margin 5: medido sobre ruido AR(1) (φ hasta 0,9) y con correlación
  # entre series, 3–4 dejaban FDR > q en series cortas.
  relative_growth:
    enabled: true
    confidence: yellow
    phi_margin: 5.0
    min_periods: {M: 36, Q: 24, A: 12}   # diferencias de crecimiento mínimas en común con el padre
    # Padre por título dentro del árbol del catálogo (ADR 0020): FRED (categoría y ancestras) y
    # unidad de BLS, BEA y Census. Solo metadatos; ninguna palabra del tema.
    parent:
      min_common_tokens: 2          # palabras mínimas del prefijo común de títulos
      max_tree_levels: 3            # categorías ancestras de FRED que se miran
    # Nacimiento de series (descriptivo): cuántas series nuevas aparecen por agencia y NAICS.
    births:
      enabled: true
      naics_digits: 3
      recent_years: 3
      min_years: 8                 # años de historia mínimos de la cuenta
      min_total: 20                # series mínimas en el grupo (agencia, NAICS)
      phi_margin: 3.0              # medido (ADR 0017): FDR <= 0,08 sobre conteos con AR(1) de φ hasta 0,8
  pelt:                         # solo para fechar el quiebre de los sobrevivientes de BH
    jump: 5
    penalty: 3.0                # pen = penalty · log(N) · sd²

fdr:
  q: 0.05
  method: bh                    # único método que decide el ranking
  comparison_method: by         # solo se reporta como comparación
  # Alerta: un detector con tasa BH (n_bh/n_tests) > factor × la mediana de los demás.
  approval_alert: {factor: 3.0, min_rate: 0.001}
  family: detector_run          # una familia por detector y por corrida
  calibration:
    method: stationary_bootstrap  # block bootstrap; no permutación simple
    block_length: auto            # entero o "auto"
    n_resamples: 999
    shared_blocks_across_series: true
    seed: 20261020

fred:
  requests_per_minute: 100        # límite oficial: 120/min; margen de seguridad
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 60
  n_buckets: 64
  page_limit_series: 1000         # máximo de category/series y series/updates
  page_limit_observations: 100000 # máximo de series/observations
  obs_batch_size: 200
  catalog_refresh_days: 30
  updates_fallback_days: 13       # series/updates solo cubre las dos últimas semanas
  verification_seed: 20261020

# Fuentes de la Fase 4 (ADR 0007). Solo parámetros de acceso y de escritura: las unidades
# (encuestas, tablas, datasets) salen del catálogo de cada fuente, nunca de esta lista.
# Presupuesto duro (ADR 0019): `--budget-min` se mira también DENTRO de cada unidad (cada
# deadline_check_rows filas y antes de cada escritura); `unit_max_min` acota una sola unidad para
# que una enorme no se coma el turno de las demás; `hard_grace_min` es el margen del watchdog
# (presupuesto + margen y el proceso se termina); progress_rows = filas entre líneas de progreso.
# Keys en el entorno: BLS_API_KEY, BEA_API_KEY, CENSUS_API_KEY; download.bls.gov exige un
# User-Agent con contacto, que se lee de SEC_USER_AGENT (decisión del 2026-11-03).
sources:
  n_buckets: 64
  user_agent_env: SEC_USER_AGENT
  bls:
    requests_per_minute: 60       # download.bls.gov no publica cupo; ritmo prudente
    max_retries: 6
    backoff_base_s: 2.0
    timeout_s: 300
    catalog_refresh_days: 30
    write_batch_rows: 500000
    unit_max_min: 40              # tope de una sola unidad (ADR 0019)
    hard_grace_min: 10            # margen del watchdog sobre el presupuesto
    # Parte del presupuesto de `update` que puede usar el crawl cuando ya hay series objetivo;
    # el resto queda para la descarga (sin objetivos aún, el crawl usa todo).
    crawl_budget_share: 0.5
    # Unidad entera excluida por una misma regla de fila (p. ej. encuesta sin datos recientes)
    # con al menos este número de series: una fila de linaje agregada (null = una por serie).
    lineage_aggregate_min_series: 100000
  bea:
    requests_per_minute: 80       # límite oficial: 100/min, 100 MB/min, 30 errores/min
    max_retries: 6
    backoff_base_s: 2.0
    timeout_s: 300
    # Un crawl completo de BEA (2.014 tablas) toma ~4,5 h: con 30 días no cabría en el
    # presupuesto semanal y la fuente recorrería el catálogo sin descargar nunca.
    catalog_refresh_days: 90
    write_batch_rows: 500000
    unit_max_min: 40              # tope de una sola unidad (ADR 0019)
    hard_grace_min: 10            # margen del watchdog sobre el presupuesto
    crawl_budget_share: 0.5
    lineage_aggregate_min_series: 100000
  census:
    requests_per_minute: 60       # sin cupo publicado con key
    max_retries: 6
    backoff_base_s: 2.0
    timeout_s: 300
    catalog_refresh_days: 30
    write_batch_rows: 500000
    unit_max_min: 40              # tope de una sola unidad (ADR 0019)
    hard_grace_min: 10            # margen del watchdog sobre el presupuesto
    crawl_budget_share: 0.5
    lineage_aggregate_min_series: 100000

# Texto (Fase 3, ADR 0005). Solo se guardan text_hash y frecuencias, nunca el texto completo.
text:
  ngram_max: 3                    # n-gramas de 1 a 3 tokens
  min_doc_count: 5                # un n-grama entra a term_freq si aparece en >= N documentos
  top_sic: 5                      # SIC de 4 dígitos por término que se guardan (sic_top_json, ADR 0012)
  workers: 4                      # procesos de análisis (HTML -> secciones -> n-gramas)
  seed: 20261103                  # muestras de medición (--sample)
  open_refresh_hours: 20          # un periodo abierto se reprocesa como mucho una vez por corrida

# Detector de términos emergentes (Fase 3, parte B; ADR 0008). Solo parámetros, sin palabras.
text_detect:
  grid: {edgar: A, federal_register: Q}   # EDGAR anual por año de presentación; FR trimestral
  window: {M: 60, Q: 20, A: 7}            # ventana previa W (línea de comparación)
  recent: {M: 24, Q: 8, A: 4}             # ventana reciente R, fuera de la línea base del nulo
  min_mean_share: 0.002           # prevalencia media mínima sobre toda la historia
  max_median_share: 0.5           # unigramas con proporción mediana >= esto: palabras funcionales
  # φ del post-blackening + 2 errores estándar. Medido (ADR 0008): con la grilla anual de EDGAR
  # (~20 años de línea base) y AR(1) φ=0,7, margen 1 daba tamaño 1,9 % al 1 % y FDR 0,07; con
  # margen 2, 0,9 % y 0,02 (φ=0,9: 1,6 % y 0,06).
  phi_margin: 2.0
  # Amplitud: entidades distintas (agencias en FR, empresas en EDGAR) que usan el término en la
  # ventana reciente. Filtro neutral (no mira el estadístico). EDGAR: 0 = desactivado, porque
  # cada documento es de una empresa y n_entities ≈ doc_count.
  min_entities: {edgar: 20, federal_register: 20}   # revisión 702b8ff3 (antes edgar 0, FR 3)
  min_signal_years: 2             # persistencia mínima de la señal, en años (revisión 702b8ff3)
  block_sample: 5000              # términos para la mediana de la longitud de bloque automática
  workers: 4
  # Punto de quiebre estimado por término (revisión 2a02c981): el inicio del crecimiento es el
  # largo de segmento L en [persistencia, recent] que maximiza T; el máximo también está en el
  # nulo. `recent` es solo el tope de L, no un corte fijo.
  # Deriva del corpus: cada término se mide contra la mediana de cambio de los términos con
  # prevalencia base parecida (cuantiles de la línea base); el nulo se arma sobre esa serie corregida.
  drift: {bins: 20, min_bin: 30, by_section: true}   # por sección: ADR 0021 (antes mezclaba secciones)
  # Un término sin ninguna fila en los últimos `persistencia` periodos no entra a la familia (ADR 0021).
  require_recent_rows: true
  # Especificidad: unigramas con prevalencia media >= esto se excluyen (prevalencia base alta),
  # y todo n-grama debe tener al menos un token con forma de sustantivo (heurística de
  # sufijos, sin modelos ni licencias externas; src/detect/text_filters.py).
  unigram_max_share: 0.05
  # Prioridad en la entrega D: efecto × (1 + bonus por palabra extra) / (1 + prevalencia/ref).
  priority: {ngram_bonus: 0.25, base_share_ref: 0.05}
  top_n: 20                       # términos de la entrega D
  # Frases de boilerplate (aprobadas por David el 2026-11-04). Un n-grama que las contiene
  # (secuencia contigua de tokens) se excluye. Única lista de frases admitida por el guard.
  boilerplate:
    - send written
    - written comments
    - submit comments
    - comments must be
    - for further information
    - further information contact
    - supplementary information
    - federal register
    - forward looking statements
    - form 10 k
    - annual report
    - table of contents
    - securities and exchange commission
    - securities exchange act
    - not applicable
    - item 1a
    - advantages and disadvantages
    - advantages disadvantages
    - risks and uncertainties
    - pros and cons
    - risk factors
    - results of operations
  # Amplitud entre grupos SIC de 2 dígitos (EDGAR): n_industries mediana en la ventana
  # reciente. 0 = no se excluye por esto; sí penaliza el score (src/rank/triangulate.py).
  min_sic2: {edgar: 0, federal_register: 0}

edgar:
  base_url: https://www.sec.gov
  data_url: https://data.sec.gov
  forms: [10-K, 10-K405]          # 10-K/A, 10-KT, 10-KSB... quedan en el linaje como excluidos
  start_year: 2006                # Item 1A obligatorio desde ejercicios cerrados >= 2005-12-01
  requests_per_second: 8          # límite oficial: 10/s
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 120
  min_chars: 2000                 # secciones más cortas (p. ej. "no aplica") -> muy_corta
  closed_grace_days: 7            # un trimestre se congela 7 días después de terminar
  reprocess_below_schema: 5       # v5: sic_top_json (SIC de 4 dígitos; v4: n_industries) obliga a volver a bajar los periodos cerrados
  submissions_api_max_ciks: 500   # más CIK que esto: se usa submissions.zip (una descarga)
  submissions_zip_max_age_hours: 20

federal_register:
  base_url: https://www.govinfo.gov
  start_year: 2000                # primer año del XML masivo de govinfo
  requests_per_second: 2          # govinfo no publica límite: margen conservador
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 120
  min_chars: 300
  closed_grace_days: 3
  reprocess_below_schema: 3       # re-procesa los meses sin n_entities normalizado (ADR 0008)

# Ranking (Fase 5, ADR 0009): clusters, cruces término–serie, triangulación y score. Solo
# parámetros: ningún tema, término ni serie.
rank:
  min_sources: 2                  # fuentes independientes mínimas (principio 4; nunca < 2)
  origin:                         # ADR 0010: independencia por ORIGEN del dato
    table: config/data_origin.yaml  # republicaciones conocidas (esquema validado)
    duplicate_rho: 0.98           # ρ de crecimientos > esto, de agencias distintas...
    level_tol: 0.02               # ...y nivel casi igual (mediana de |a−b|/media ≤ tol): mismo origen
    min_overlap: 12               # periodos comunes mínimos para comparar niveles
  naics:                          # ADR 0012: tablas oficiales de Census (config/naics/SOURCES.md)
    names_table: config/naics/naics_2022.csv
    concordance_table: config/naics/sic_naics_concordance.csv
    bea_table: config/naics/bea_industry_naics.csv          # código BEA -> NAICS 2022 (ADR 0013)
    concordance_2017_table: config/naics/naics_2017_to_2022.csv
    cluster_majority: 0.5         # herencia por cluster: solo códigos con más de este peso entre los miembros con código
    not_applicable_sources: [federal_register]  # sin industria: fuera del denominador de cobertura
  # Etiqueta "efecto de tasas" (src/rank/rate_effect.py, ADR 0013): el crecimiento del cluster se
  # regresa sobre Δ de la tasa de corto plazo (context.reference_series.short_rate), rezagos
  # 0..max_lag en periodos de la grilla. Marca si la relación es significativa (stationary
  # bootstrap, BH sobre los clusters) y el cambio de pendiente cae ≥ min_drop o deja de ser
  # significativo al usar el residuo. Solo etiqueta: nunca filtra ni cambia el score.
  # include_level: además de Δr, el NIVEL de la tasa (los índices de acumulación crecen ≈ r/periodos
  # por año). min_rows_by_grid: periodos mínimos con dato de la tasa para evaluar un cluster
  # (la calibración de `slope`, incluida su línea base mínima, no cambia).
  rate_effect:
    max_lag: 2
    min_drop: 0.5
    seed: 20261109
    include_level: true
    min_rows_by_grid: {M: 36, Q: 20, A: 12}
  # Etiqueta "efecto inflación" (src/rank/inflation_effect.py, ADR 0015): igual que el efecto de
  # tasas, pero el regresor es la inflación del deflactor aprobado (context.reference_series.
  # deflator); sin claves nuevas. Solo etiqueta: nunca filtra ni cambia el score.
  inflation_effect:
    max_gap_months: 1             # meses consecutivos faltantes del deflactor que se interpolan
    max_lag: 2
    min_drop: 0.5
    seed: 20261110
    min_rows_by_grid: {M: 36, Q: 20, A: 12}
  # Etiqueta de trayectoria (src/rank/trajectory.py, ADR 0025): CAGR de la tendencia previa contra
  # el de la ventana reciente; el ancla es el inicio de la última recesión (USREC) dentro de
  # max_back_years. «frena_caida» no cuenta como dirección «sube». Solo etiqueta.
  trajectory:
    prior_years: 5
    recent_years: 3
    peak_years: 2
    max_back_years: 10
  # Lista "en observación" (src/rank/watchlist.py, ADR 0016; la clave es single_origin porque el
  # guard no admite «watch» en claves): fenómenos de UN solo origen con señal
  # (q <= fdr.q), evidencia de demanda (cantidad o valor), sin efecto de tasas ni de inflación y con
  # efecto estandarizado >= min_effect. Lista separada: no es el ranking, no entra al score.
  single_origin:
    min_effect: 1.0
  # Fenómenos: clusters con NAICS compartido (a naics_digits dígitos), misma dirección del efecto y
  # ventanas solapadas se triangulan juntos (src/rank/phenomena.py). La regla de origen no cambia.
  phenomena:
    naics_digits: 3
    min_naics_share: 0.25         # peso mínimo de un código dentro del cluster para contar
    min_direction_share: 0.6      # acuerdo mínimo de signo entre las series del cluster
  measure_kind:                   # ADR 0014: clase de medida (precio, cantidad, valor, tasa, otro)
    table: config/measure_kind.yaml   # metadatos de agencia: unidades, prefijos oficiales, tipos de tabla
  max_candidates: 50              # tope por tipo de candidato y corrida
  embeddings:
    backend: fastembed            # fastembed (uv sync --group embed) | hashing (tests, sin red)
    model: BAAI/bge-small-en-v1.5 # MIT; vía fastembed (Apache-2.0), ONNX local
    batch_size: 256
    threads: 0                    # 0 = todos los núcleos
    cache_dir: data/cache/models  # modelo descargado (caché de Actions, no va a R2)
  cluster:
    alpha: 0.5                    # s = α·max(ρ,0) + (1−α)·cos_título
    threshold: 0.8                # corte del enlace promedio (similitud)
    duplicate_rho: 0.98           # copia del mismo dato entre fuentes: ρ y título casi iguales
    duplicate_cos: 0.9
    min_overlap: {M: 36, Q: 12, A: 8}  # periodos comunes mínimos para usar ρ
    max_series: 6000              # más series con señal: las de menor q se agrupan, el resto solas
  links:
    # Umbral por término, desde los datos: cuantil de la mejor coincidencia (máximo coseno contra
    # todas las series) de una muestra de términos comunes de term_freq sin señal.
    null_quantile: 0.95
    null_sample: 2000
    top_k: 20                     # series por término, como máximo
    require_overlap: true         # la ventana del término alcanza la de la señal numérica
    # El coseno de títulos solo SUGIERE pares. Un par cuenta como vínculo (y el término como
    # segunda fuente) si pasa la prueba de co-movimiento: Δ logit anual del término contra el
    # crecimiento anual de la serie, rezagos ±max_lag, stationary bootstrap por bloques con
    # índices compartidos y su propia familia BH (q = fdr.q).
    # Grilla de comparación. El término se agrega a su grilla (`text_grid`: Federal Register
    # trimestral, EDGAR anual: 10-K anuales) y nunca se interpola; cada par se prueba en la más
    # gruesa entre la del término y la nativa de la serie (una serie anual con un término trimestral
    # se prueba en anual). El trimestral da ~4 veces más puntos que el anual: con ~25 años de
    # Federal Register, ~100 trimestres en lugar de ~25 años.
    # min_overlap_by_grid: periodos comunes mínimos de la grilla de comparación (A: años; Q:
    # trimestres). max_lag: entero o por grilla (en periodos de esa grilla).
    # Mismo bootstrap por bloques con índices compartidos dentro de cada grilla; una sola familia
    # BH sobre todos los pares.
    comove:
      text_grid: {federal_register: Q, edgar: A}
      max_lag: {A: 2, Q: 4}
      min_overlap: 8
      min_overlap_by_grid: {A: 6, Q: 24}
      n_resamples: 999
      block_length: auto
      seed: 20261104
    seed: 20261103
  text_only:
    enabled: true                 # términos parecidos emergentes en ≥ 2 fuentes de texto
    min_cos: 0.9                  # piso del umbral término–término (además del nulo)
  # Pesos del score (componentes normalizados por rango dentro de la corrida).
  weights:
    strength: 3.0                 # −log10 q (mediana por fuente independiente)
    n_sources: 2.0
    effect: 1.0
    agreement: 1.0                # slope y regime a la vez
    breadth: 1.0                  # entidades distintas que usan el término
    size: 0.5                     # miembros del cluster (log, rendimiento decreciente)

# Reporte HTML semanal y dashboard (src/report). El destino de publicación es un paso aparte.
report:
  site_dir: data/site
  reports_dir: data/reports       # historial semanal (se sincroniza a R2 como reports/)
  # Registro de corridas propio: el workflow Reporte no comparte grupo de concurrencia con la
  # ingesta, así que nunca sincroniza logs/ entero (pisaría runs.jsonl).
  runs_file: data/logs/reporte/runs.jsonl
  chart_years: 20
  # Zoom de 12 meses: contexto DESCRIPTIVO (sin p/q; no cambia el ranking). Estado por serie M/W/D
  # comparando el ritmo anualizado de los últimos `months` con la pendiente de `baseline_years` años:
  # revierte si tiene signo contrario y |reciente| >= reverse_frac·|tendencia|; acelera si
  # reciente/tendencia >= accel_ratio; se frena si <= slow_ratio; si no, continúa.
  recent:
    months: 12
    chart_months: 24
    baseline_years: 5
    accel_ratio: 1.5
    slow_ratio: 0.5
    reverse_frac: 0.25
  explorer:
    n_buckets: 128
    max_file_kb: 2048
    max_total_mb: 80

# Ficha del fenómeno (Fase 5, ADR 0009): contexto DESCRIPTIVO por candidato (sin p/q; no cambia
# el ranking). Las reglas miran unidades y metadatos, nunca temas.
context:
  # ÚNICA excepción al principio 1 (aprobada por David el 2026-11-04): series de referencia
  # metodológicas, no temas. No entran a detectores ni al ranking. El guard acepta ids solo aquí,
  # con exactamente estas tres claves.
  reference_series:
    deflator: CPIAUCSL            # IPC-U (deflactor para valores reales)
    population: POP               # población (per cápita)
    recessions: USREC             # indicador de recesión (sombreado)
    # Cuarta clave, aprobada por David el 2026-11-09 (ADR 0009/0013): tasa de corto plazo (T-bill
    # a 3 meses, mensual, H.15, sin copyright) para etiquetar "efecto de tasas". Solo etiqueta.
    short_rate: TB3MS
  max_related: 8
  pool_max: 300                   # vecinas de la misma rama prefiltradas por título
  alpha: 0.5                      # puntaje = α·coseno del título + (1−α)·|ρ| de crecimientos
  min_overlap: {M: 36, Q: 12, A: 8}
  max_lag_months: 24
  windows_years: [3, 5, 7]        # sensibilidad de la pendiente a la ventana
  # Unidades nominales (deflactar / per cápita): casan la primera y no la segunda.
  nominal_units: "(?i)dollar|\\$"
  not_nominal_units: "(?i)chained|real|constant|percent|index|rate|ratio"
  # Rol inferido de las UNIDADES (primera regex que casa; si ninguna: otro).
  roles:
    tasa: "(?i)percent|rate|ratio"
    empleo: "(?i)person|employ|jobs|workers"
    precio: "(?i)index|price"
    dinero: "(?i)dollar|\\$"
    cantidad: "(?i)units|number|tons|barrels|thousands|millions|billions"

logging:
  level: INFO
  runs_file: data/logs/runs.jsonl
