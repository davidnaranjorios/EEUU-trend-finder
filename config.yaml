# Configuración del sistema. Prohibido listar temas, industrias, términos o series aquí
# (principio 1; lo verifica tests/test_no_hardcoded_topics.py).

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  signals_dir: data/signals
  logs_dir: data/logs
  reports_dir: reports

eligibility:
  # Mínimo de observaciones por frecuencia para que una serie entre a los detectores.
  min_obs:
    D: 1000
    W: 260
    M: 120
    Q: 40
    A: 15
  # Una serie sin actualizar en más de estos días se considera inactiva.
  max_staleness_days:
    D: 30
    W: 60
    M: 120
    Q: 240
    A: 730
  # Umbrales fijados el 2026-10-23 a la vista del embudo medido (ADR 0002).
  # Historia más corta que esto no se descarta: va al grupo "nuevas".
  min_history_years: 10
  # Una versión por variable (mismo título normalizado). Orden de preferencia del representante:
  # ajuste estacional, unidades en nivel sobre transformadas, frecuencia más alta que cumpla la
  # historia mínima, historia más larga y, en empate, el identificador.
  variants:
    seasonal_preference: [SA, SAAR, SSA, NSA, NSAAR]
    transformed_units_regex: "(?i)change|growth"
    frequency_preference: [D, W, M, Q, A]

# Vintages de ALFRED solo para una muestra aleatoria estratificada (frecuencia x agencia).
vintages:
  sample_size: 2000
  seed: 20261021
  groups: [nacional]
  max_vintage_dates_per_request: 2000   # tope oficial de series/observations

# Descarga inicial y semanal de valores vigentes (API v2 por release). Decidido: solo nacional.
download:
  groups: [nacional]
  v2_page_limit: 500000                 # máximo oficial de release/observations

# Exportes para la futura web estática (src/export.py). Fichas solo de estos grupos; los demás se
# cuentan en funnel.json. Si un archivo o el total pasa el tope, el export falla (no publica).
exports:
  groups: [nacional]
  n_buckets: 64
  max_file_kb: 512
  max_total_mb: 20

# Parquet definitivo en Cloudflare R2. Credenciales solo en .env (AWS_*, CLOUDFLARE_ACCOUNT_ID).
storage:
  bucket: trend-finder
  prefix: processed

persistence:
  # Periodos consecutivos que debe sostenerse una aceleración para contar.
  min_consecutive_periods:
    D: 60
    W: 13
    M: 6
    Q: 3
    A: 2

# Detectores numéricos de la Fase 2 (ADR 0007). Solo parámetros: ningún tema ni serie.
detect:
  source: fred
  detectors: [slope, regime]
  # Ventana del cambio de pendiente, en periodos de la grilla (D y W se agregan a mensual):
  # 5 años recientes frente a 5 previos; anual 7 + 7 (decisión del 2026-11-03).
  slope_window: {M: 60, Q: 20, A: 7}
  lookback_years: 15            # historia usada por ambos detectores (CUSUM y línea base)
  # Línea base mínima del nulo de slope, en periodos. Medido (ADR 0007): anuales con 8 o 23
  # periodos de base daban P(p<0,001) de 2,2 % y 0,6 % con AR(1); con 33, 0,1 %.
  slope_min_baseline: 33
  winsor_mad: 4.0               # crecimiento recortado en mediana ± 4·MAD
  max_gap_share: 0.1            # máximo de periodos faltantes dentro de la ventana
  phi_margin: 1.0               # φ del post-blackening + 1 error estándar (conservador)
  # regime: las pruebas en el piso (< 10 excedencias de 999) se recalculan con estas réplicas
  # (el CUSUM es barato); después, cola GPD sobre ese nulo si aún hace falta.
  regime_escalate: 99999
  workers: 4                    # procesos (runner de GitHub Actions: 4 vCPU)
  tail:                         # cola GPD (Knijnenburg et al. 2009)
    method: gpd
    min_exceedances: 10
    n_exceed: 250
    n_exceed_min: 50
    gof_alpha: 0.05
  pelt:                         # solo para fechar el quiebre de los sobrevivientes de BH
    jump: 5
    penalty: 3.0                # pen = penalty · log(N) · sd²

fdr:
  q: 0.05
  method: bh                    # único método que decide el ranking
  comparison_method: by         # solo se reporta como comparación
  family: detector_run          # una familia por detector y por corrida
  calibration:
    method: stationary_bootstrap  # block bootstrap; no permutación simple
    block_length: auto            # entero o "auto"
    n_resamples: 999
    shared_blocks_across_series: true
    seed: 20261020

fred:
  requests_per_minute: 100        # límite oficial: 120/min; margen de seguridad
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 60
  n_buckets: 64
  page_limit_series: 1000         # máximo de category/series y series/updates
  page_limit_observations: 100000 # máximo de series/observations
  obs_batch_size: 200
  catalog_refresh_days: 30
  updates_fallback_days: 13       # series/updates solo cubre las dos últimas semanas
  verification_seed: 20261020

# Texto (Fase 3, ADR 0005). Solo se guardan text_hash y frecuencias, nunca el texto completo.
text:
  ngram_max: 3                    # n-gramas de 1 a 3 tokens
  min_doc_count: 5                # un n-grama entra a term_freq si aparece en >= N documentos
  workers: 4                      # procesos de análisis (HTML -> secciones -> n-gramas)
  seed: 20261103                  # muestras de medición (--sample)
  open_refresh_hours: 20          # un periodo abierto se reprocesa como mucho una vez por corrida

# Detector de términos emergentes (Fase 3, parte B; ADR 0008). Solo parámetros, sin palabras.
text_detect:
  grid: {edgar: A, federal_register: Q}   # EDGAR anual por año de presentación; FR trimestral
  window: {M: 60, Q: 20, A: 7}            # ventana previa W (línea de comparación)
  recent: {M: 24, Q: 8, A: 4}             # ventana reciente R, fuera de la línea base del nulo
  min_mean_share: 0.002           # prevalencia media mínima sobre toda la historia
  max_median_share: 0.5           # unigramas con proporción mediana >= esto: palabras funcionales
  # φ del post-blackening + 2 errores estándar. Medido (ADR 0008): con la grilla anual de EDGAR
  # (~20 años de línea base) y AR(1) φ=0,7, margen 1 daba tamaño 1,9 % al 1 % y FDR 0,07; con
  # margen 2, 0,9 % y 0,02 (φ=0,9: 1,6 % y 0,06).
  phi_margin: 2.0
  block_sample: 5000              # términos para la mediana de la longitud de bloque automática
  workers: 4

edgar:
  base_url: https://www.sec.gov
  data_url: https://data.sec.gov
  forms: [10-K, 10-K405]          # 10-K/A, 10-KT, 10-KSB... quedan en el linaje como excluidos
  start_year: 2006                # Item 1A obligatorio desde ejercicios cerrados >= 2005-12-01
  requests_per_second: 8          # límite oficial: 10/s
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 120
  min_chars: 2000                 # secciones más cortas (p. ej. "no aplica") -> muy_corta
  closed_grace_days: 7            # un trimestre se congela 7 días después de terminar
  submissions_api_max_ciks: 500   # más CIK que esto: se usa submissions.zip (una descarga)
  submissions_zip_max_age_hours: 20

federal_register:
  base_url: https://www.govinfo.gov
  start_year: 2000                # primer año del XML masivo de govinfo
  requests_per_second: 2          # govinfo no publica límite: margen conservador
  max_retries: 6
  backoff_base_s: 2.0
  timeout_s: 120
  min_chars: 300
  closed_grace_days: 3

logging:
  level: INFO
  runs_file: data/logs/runs.jsonl
